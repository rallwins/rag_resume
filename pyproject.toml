[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-resume"
version = "0.1.0"
description = "A local Ollama resume chatbot with retrieval guardrails and Langfuse tracing"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.31",
    "ollama>=0.4",
    "pypdf>=5",
    "python-multipart>=0.0.9",
    "langfuse>=3,<4",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
resume-chat = "app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["app", "rag_agent"]

[tool.setuptools.data-files]
"share/rag-resume/static" = ["static/index.html"]